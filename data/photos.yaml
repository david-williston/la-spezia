# ============================================================================
# PHOTOS: focal point + alt text + caption for each file in images/
#
# To swap a photo: replace the file in images/ (same name), then adjust here:
#   focus_x / focus_y = which part of the photo stays visible when cropped (0% left/top ... 100% right/bottom)
#   *_m = same, but for phones (optional)
# Alt text describes what the photo really shows. Update it if you change the photo.
# Photos are user-contributed Google Maps photos used with the owner's permission (reconfirm before launch).
# The ambiente-1 photo shows a staff member at the counter - confirm he is OK with it, or swap the photo.
# ============================================================================
